# Publishes to PyPI when a version tag (v1.2.0, ...) is pushed.
#
# Uses PyPI "Trusted Publishing": GitHub proves its identity to PyPI directly, so there is no
# API token to create, store, rotate or leak. One-time setup is in RELEASING.md.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag, setup.py and __init__.py must all name the same version
        run: python tests/test_version.py "${GITHUB_REF_NAME}"

      - run: python -m pip install build twine

      - run: python -m build

      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish: it is the only one granted an identity token.
    environment:
      name: pypi
      url: https://pypi.org/p/discotoolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
