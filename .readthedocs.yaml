# Read the Docs no longer hosts the documentation: it builds a tiny site whose every page redirects
# to the DISCO website (tools/readthedocs-redirect). Once the project's redirect is set in the Read
# the Docs admin, or the project is archived, this file and that folder can go.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: tools/readthedocs-redirect/mkdocs.yml

python:
  install:
    - requirements: tools/readthedocs-redirect/requirements.txt
